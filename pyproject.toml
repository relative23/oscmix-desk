# Tool configuration only -- oscmix-desk is installed by install.sh,
# not by pip, so there is no [project] table and nothing to build here.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests bind real UDP sockets and start threads; surface anything that
# escapes a worker thread instead of letting it pass as a warning.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
# The runtime package plus the extension-less executables in bin/.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py",
           "bin/oscmix-session", "bin/oscmix-launch"]
# mutants/ holds machine-rewritten copies of the source; linting them
# measures the mutation engine, not this project.
extend-exclude = ["mutants", "build"]
# 3.9 is the oldest interpreter the CI matrix covers; keeping it means no
# PEP 604 unions (`X | None`) and no PEP 585 builtins in evaluated
# annotations, which is why the modernization rules stay off below.
target-version = "py39"
# The code wraps at 79; a handful of pre-existing lines run to 90.
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RET", "ARG", "PIE", "PT",
          # Added in 0.2.0, each for checking rather than taste:
          "S",      # security -- this project spawns processes and signals PIDs
          "A",      # shadowing a builtin
          "G",      # logging call format (lazy %-args, not f-strings)
          "ISC",    # implicit string concatenation, i.e. a forgotten comma
          "TID",    # import hygiene
          "RUF",    # ruff's own correctness checks
          "PERF",   # loops that should not be loops
          "FURB",   # genuinely simpler stdlib usage
          "TRY"]    # exception handling that hides the cause
ignore = [
    # `%`-formatting is deliberate and consistent here: logging takes its
    # arguments lazily, and the OSC paths read better as format strings.
    "UP031",
    # try/except/pass is clearer than contextlib.suppress in the
    # best-effort teardown paths, and avoids an import in a hot loop.
    "SIM105",
    # dict(...) with keyword arguments is how the test fixtures express
    # named defaults; a literal would read worse.
    "C408",
    # Launching a known binary by name is the entire point of this
    # program: it starts alsaseqio and oscmix, resolved through
    # resolve_binary() rather than taken from user input. Flagging every
    # such call would mean 13 noqa comments saying "yes, on purpose".
    "S603", "S607",
    # A ConfigError names the section and the option that is wrong -- that
    # detail is the contract, not a message that belongs in a subclass.
    "TRY003",
    # Rebuilding a list with extend() instead of append() in a loop is a
    # micro-optimisation on paths that run once per start.
    "PERF401",
    # The try/except inside the read-back loop guards one malformed
    # datagram out of thousands; hoisting it would abandon the dump.
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# assert is how a test states its expectation; S311 is a seeded RNG that
# injects faults; monkeypatch stubs must match a signature whether or not
# they use every parameter.
"tests/*" = ["S101", "S311", "ARG001", "ARG005", "RUF005"]
# The harness and policy scripts are CLIs: printing is their output, and
# os.execv in the launcher is deliberate.
"scripts/*" = ["S606"]
# Verbatim /proc/net/udp fixtures -- wrapping them would break the parser
# under test.
"tests/test_readiness.py" = ["E501"]
# pytest.raises(ValueError) is the contract of the OSC decoder: it has one
# error type and the message is not part of the API.
"tests/test_osc.py" = ["PT011"]

[tool.coverage.run]
branch = true
source = ["src/oscmix_desk", "bin"]
# The integration tests run oscmix-session as a real subprocess. Without
# this the branches they exercise look untested, which understates the
# suite and hides which of them genuinely are.
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
# A ratchet, not a target: it sits just under what the suite covers today
# so coverage cannot silently erode. Raise it when it earns the raise.
#
# It jumped from 60 to 84 when subprocess measurement was switched on --
# the integration tests always drove the entry point, session and CLI, the
# numbers just never showed it. Nothing about the tests changed.
#
# 84 -> 94 (2026-08-16): the suite had measured 91 for some time without
# the gate following, which is seven points of erosion nothing would have
# noticed. The launcher moving into the package and gaining
# tests/test_launcher.py took it from 61% to 100% and the total to 95%.
#
# 95 -> 96 (2026-09-11, 0.6.4): measured 96.4 on the release revision,
# more than a point above the gate, so the checklist's rule applies --
# raise it now rather than next release. The rise is the profile code's
# error branches, each driven by a test since the marker and lock work.
fail_under = 96

[tool.mutmut]
# Mutation testing answers the question coverage cannot: do the assertions
# actually catch a wrong value, or do they merely execute the line?
# Scoped to the modules that decide what the hardware does -- the ones
# where a surviving mutant means silent, audible breakage.
#
# The register *table*, devices.py, is exempt, marked in the file
# with `# pragma: no mutate start` / `end`. It is data built at import
# time, which mutmut cannot attribute to a covering test, so it scored
# as though nothing tested it while the recordings check it harder than
# a mutant would. ADR 0015 has the measurement.
source_paths = ["src/oscmix_desk/"]
pytest_add_cli_args_test_selection = ["tests/"]
