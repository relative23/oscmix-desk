name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # For the mutation job only; see its `if:` and the comment above it.
  # 03:41 UTC, off the hour because that is when GitHub's scheduler is
  # least congested, and well clear of the soak at 04:17.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per commit on push, per ref on a pull request, and the difference
  # is not cosmetic. A concurrency group holds one running run and one
  # queued run; a third arrival displaces the *queued* one. With every
  # push to main sharing one group, three pushes inside an hour meant
  # the middle commit was cancelled before a single job started --
  # dd44ebb, 0 jobs, conclusion "cancelled", while the comment here
  # claimed main runs were kept. A commit reached main with no CI at
  # all. github.sha gives each push its own group, so nothing queues
  # behind anything; pull requests still share a group per ref, which
  # is what makes a newer revision cancel an older one.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Every job carries a timeout. GitHub's default is 360 minutes, and
    # that is not a ceiling anybody chose: `sudo apt-get update` hung on
    # a runner once and burned all six hours before being killed, on a
    # job whose measured maximum is 6.7 minutes.
    #
    # The numbers come from the green runs on main between 2026-09-11 and
    # 2026-09-16 -- 29 of each job, 15 of the mutation job (min/max,
    # minutes):
    #
    #   Lint, Types & Dead Code  0.2 / 0.5     Coverage        2.0 / 3.3
    #   Tests (per version)      1.8 / 3.6     Build upstream  0.4 / 1.3
    #   Flakiness Gate           8.0 / 13.0    Mutation       77.6 / 80.9
    #
    # An earlier table said 8.3 for the flakiness gate under a timeout of
    # 15, and nobody re-measured while the suite grew: the 0.6.10 push ran
    # into that timeout mid-way through its fifth run. The mutation job
    # hit its 90 every night from 2026-09-12 on and reported nothing.
    #
    # Each timeout is set well above its measured maximum -- these are
    # for a hang, not for a slow day. tests/test_ci_workflow.py asserts
    # every job has one, and that none is large enough to hide a hang.
    name: Lint, Types & Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make typecheck
      - run: make deadcode
      # tests/test_unit_file.py matches strings; only systemd knows the
      # directive *names*, and an unknown key is silently ignored rather
      # than rejected. The runner has systemd, so the skip does not fire
      # here -- if it ever does, that is a broken image, not a pass.
      - name: Validate the systemd unit
        run: |
          status=0
          ./scripts/verify-unit.sh || status=$?
          if [ "$status" -eq 77 ]; then
            echo "systemd-analyze is missing on this runner; the unit was" \
                 "not validated at all" >&2
            exit 1
          fi
          exit "$status"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the code is written against (no PEP 604 unions);
        # the newest release guards against upcoming stdlib changes.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # A checkout without hypothesis skips tests/test_contracts.py in
      # full and still reports green. CI must never be that checkout, so
      # here the skip is a collection error rather than a banner.
      - run: make test
        env:
          OSCMIX_REQUIRE_CONTRACTS: "1"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The threshold lives in pyproject.toml as a ratchet.
      - run: make coverage
        env:
          OSCMIX_REQUIRE_CONTRACTS: "1"
      - run: python -m coverage html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  flake:
    name: Flakiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The suite binds real UDP sockets and drives background threads, so
      # a single green run proves little -- a teardown race in the device
      # fakes survived several full runs before it was caught.
      - run: make flake

  mutation:
    name: Mutation Score
    # Not a blocking gate: its number moves for reasons other than test
    # quality (new code brings new mutants). It reports; the policy
    # script fails only when the *score* drops.
    #
    # The timeout was 45 and two consecutive runs hit it. The first
    # diagnosis -- that the job had simply grown past its ceiling -- was
    # wrong, and raising it to 90 did not help: that run hit 90 too.
    #
    # The real cause was test wall-clock, not mutant count. mutmut
    # re-runs the covering tests per mutant, so a slow test is paid
    # thousands of times:
    #
    #   - the profile tests each waited out the link barrier, because
    #     apply_routing was handed a backend and the barrier opened its
    #     own socket anyway, so no double could answer it;
    #   - one CLI test waited the full 10 s verify window with nothing
    #     to answer it, at 11.5 s the slowest single test in the suite;
    #   - CapturingBackend and FakeOscmix used a 3 s socket timeout and
    #     ended the thread on timeout, so stop() cost up to 3 s in
    #     join() -- per test, asserting nothing. test_faults.py had used
    #     0.2 s for a long time; this file had not adopted it.
    #
    # Suite: 106 s -> 73 s. A clean local run (cache cleared, as here)
    # is 44 minutes at 1.43 mutations/second, down from 56 with a warm
    # cache before the fix.
    #
    # Re-measured 2026-08-24, because runs had passed 60: three in a row
    # at 69, 74 and 73 minutes. The comment above asked for the slowest
    # tests to be checked first, and they were. There is no hot spot.
    #
    #   tests     665 -> 945    +42%
    #   suite      73 -> 106 s  +45%   proportional, no regression
    #   mutants  4180 -> 4866   +16%
    #   mutation   44 -> 72 min +64%
    #
    # Cost is mutants x suite time: 4180*73 -> 4866*106 predicts +69%
    # against +64% measured. Shortening the link barrier was tried and
    # saves 1.6 s of 106 while breaking two tests, so there is nothing
    # to reclaim. 90 minutes stays as the ceiling.
    #
    # This runs nightly and not on every push, and the numbers above are
    # why. The cost grows multiplicatively with the project and would be
    # past two hours by the next release. The value was never in the
    # gate -- the score has never failed one, in any run. It was in
    # *reading the survivors*, which found three real defects in 0.3.0,
    # including pinning silently not working, while the policy was green
    # either way. A nightly score change still prompts that reading, one
    # day later.
    #
    # The release checklist requires a run of its own, which is where it
    # has to be current rather than recent.
    #
    # 90 held until the mutant count passed 6600 (0.6.9): every nightly
    # run from 2026-09-12 to 2026-09-16 was cancelled at 90, so the score
    # this job exists to report was not reported for five nights, and
    # the run is `continue-on-error`, so nothing turned red. 7118 mutants
    # took 129 minutes locally on four children in 0.6.10; 180 is twice
    # the last run that finished here (80.9) and is re-measured from the
    # nights that follow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt mutmut
      - run: make mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
          retention-days: 14

  build-oscmix:
    name: Build Upstream oscmix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      # Proves install.sh can build upstream oscmix on a clean system.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libgtk-3-dev \
            libglib2.0-dev-bin
      # The pinned revision, not master: the point of the pin is that CI
      # builds the same backend the hardware measurements were taken
      # against. install.sh carries the SHA.
      - name: Build the pinned upstream revision
        run: |
          ref=$(sed -n 's/^OSCMIX_REF="\${OSCMIX_REF:-\(.*\)}"$/\1/p' install.sh)
          test -n "$ref" || { echo "no pinned OSCMIX_REF in install.sh"; exit 1; }
          echo "pinned upstream ref: $ref"
          git clone --quiet https://github.com/michaelforney/oscmix build/oscmix
          git -C build/oscmix checkout --quiet "$ref"
          test "$(git -C build/oscmix rev-parse HEAD)" = "$ref"
          make -C build/oscmix
          test -x build/oscmix/oscmix
          test -x build/oscmix/alsaseqio
          test -x build/oscmix/gtk/oscmix-gtk
      # A dry run against a fake /proc resolves the config and prints the
      # exact OSC messages the routing produces -- the cheapest end-to-end
      # check that links are still emitted before the mix matrix.
      - name: Dry-run the routing and assert the phase order
        run: |
          mkdir -p fake-proc/asound/seq
          cat > fake-proc/asound/seq/clients <<'EOF'
          Client info
            cur  clients : 2

          Client   0 : "System" [Kernel]
          Client  42 : "Fireface UCX II (00000000)" [Kernel]
            Port   1 : "Port" (RWeX) [In/Out]
          EOF
          # Two routes on purpose: with one route the per-route order and
          # the real order coincide, so a single-route config cannot show
          # the defect this check guards. The dry run prints the same plan
          # apply_routing sends (see test_the_dry_run_prints_exactly_the_
          # datagrams_the_apply_sends), so the printed order is evidence.
          OSCMIX_PROC_ROOT=fake-proc python bin/oscmix-session \
            --config tests/data/two-routes.conf --dry-run 2>&1 | tee dry-run.txt
          last_link=$(grep -n "would send: .*/stereo " dry-run.txt \
            | tail -1 | cut -d: -f1)
          first_mix=$(grep -n "would send: /mix/" dry-run.txt \
            | head -1 | cut -d: -f1)
          test -n "$last_link" && test -n "$first_mix"
          # Every link of every route, then the barrier, then every mix.
          test "$last_link" -lt "$first_mix" \
            || { echo "mix matrix written before the last channel link"; exit 1; }
          test "$(grep -c 'would send: .*/stereo ' dry-run.txt)" -eq 4
          test "$(grep -c 'would send: /mix/' dry-run.txt)" -eq 2
