name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Check installation and reproducibility
        run: |
          python -m pytest -q tests/test_install_sh.py tests/test_upgrade.py tests/test_release_archive.py
          python scripts/build-release.py --output build/release
          python scripts/build-release.py --output build/repeated
          diff -r build/release build/repeated
          mkdir build/extracted
          tar -xzf build/release/oscmix-desk-*.tar.gz -C build/extracted
          python -m pytest -q build/extracted/oscmix-desk-*/tests/test_install_sh.py
          cd build/release
          sha256sum --check SHA256SUMS
      - name: Require the published tag to match the artifact
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import json, os; m=json.load(open("build/release/release-manifest.json")); assert os.environ["RELEASE_TAG"] == "v" + m["version"]'
      - name: Attest the archive and its manifest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'build/release/*'
      - name: Include the attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" build/release/attestation.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: build/release/
          retention-days: 30
      - name: Attach to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/release/*
