name: Release artifacts

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Check installation and reproducibility
        run: |
          python -m pytest -q tests/test_install_sh.py tests/test_upgrade.py tests/test_release_archive.py
          python scripts/build-release.py --output build/release
          python scripts/build-release.py --output build/repeated
          diff -r build/release build/repeated
          mkdir build/extracted
          tar -xzf build/release/oscmix-desk-*.tar.gz -C build/extracted
          python -m pytest -q build/extracted/oscmix-desk-*/tests/test_install_sh.py
          cd build/release
          sha256sum --check SHA256SUMS
      - name: Require the release tag and include its measured evidence
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          output = Path('build/release')
          manifest = json.loads((output / 'release-manifest.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + manifest['version']
          evidence = Path('docs/evidence') / manifest['version']
          assert (evidence / 'release-notes.md').is_file(), 'Release notes are required before tagging'
          software = json.loads((evidence / 'software-qualification.json').read_text())
          assert software['candidate'] == manifest['version'] and software['status'] == 'qualified'
          required = {'check', 'coverage', 'flake', 'soak-200', 'unit', 'mutation'}
          required.update('python-3.%d' % minor for minor in range(9, 15))
          required.update('fault-%02d' % index for index in range(1, 16))
          assert required <= {row['gate'] for row in software['gates'] if row['exit'] == 0}
          assert all(row['exit'] == 0 for row in software['gates'])
          paths = [path for directory in ('src', 'tests', 'bin', 'scripts')
                   for path in Path(directory).rglob('*')
                   if path.is_file() and '__pycache__' not in path.parts
                   and path.suffix not in ('.pyc', '.pyo')]
          paths += [Path(name) for name in ('pyproject.toml', 'requirements-dev.txt', 'Makefile')]
          tested = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
          assert software['tested_files_sha256'] == tested, 'Software qualification predates these files'
          support = [Path('install.sh'), Path('uninstall.sh'), Path('quality/vulture-allowlist.py')]
          support += [path for directory in ('config', 'systemd', 'udev', 'packaging')
                      for path in Path(directory).rglob('*') if path.is_file()]
          support_hashes = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in support}
          assert software['supporting_files_sha256'] == support_hashes, 'Installation files changed after qualification'
          lifecycle = json.loads((evidence / 'lifecycle.json').read_text())
          assert lifecycle['ok'] is True
          assert lifecycle['physical_disconnect']['no_interface_check']['ok'] is True
          hardware = json.loads((evidence / 'hardware-evidence.json').read_text())
          assert hardware['ok'] is True and hardware['complete'] is True and not hardware['unmeasured']
          sweep = json.loads((evidence / 'write-sweep-ucx2.json').read_text())
          assert sweep['schema'] == 2 and sweep['error'] is None and not sweep['not_restored']
          assert sweep['before_messages'] == sweep['after_messages'], 'Sweep left changed readable state'
          assert sweep['findings'] and len(sweep['findings']) == sweep['probed']
          assert all(row['verdict'] in ('confirmed', 'skipped') for row in sweep['findings'])
          runtime = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                     for path in Path('src/oscmix_desk').glob('*.py')}
          assert lifecycle['installed_runtime_sha256'] == runtime
          for record in (hardware, sweep):
              assert record['oscmix_revision'] == manifest['oscmix_revision']
              assert record['desk_source']['runtime_sha256'] == runtime, 'Hardware evidence predates this runtime'
          for source in sorted(evidence.glob('*.json')):
              shutil.copy2(source, output / source.name)
          shutil.copy2(evidence / 'release-notes.md', output / 'release-notes.md')
          (output / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in sorted(output.iterdir()) if path.name != 'SHA256SUMS'))
          PY
          cd build/release
          sha256sum --check SHA256SUMS
      - name: Attest the archive, manifest and attached evidence
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'build/release/*'
      - name: Include the attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" build/release/attestation.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: build/release/
          retention-days: 30
      - name: Create or resume a draft for the pushed tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > build/is-draft; then
            test "$(cat build/is-draft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file build/release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --notes-file build/release/release-notes.md
      - name: Attach to a release published through the UI
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/release/*
