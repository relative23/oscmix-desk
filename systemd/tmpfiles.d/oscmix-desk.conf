# One lock directory for every writer of a Fireface on this machine.
#
# The lock has to name the hardware and nothing else: not a config
# directory, not an environment variable, not a user. $XDG_RUNTIME_DIR
# is per user and absent from sudo, cron and a bare ssh command, so a
# writer without it used to compute a different path and walk straight
# past a holder (ADR 0023).
#
# Mode 3770, root:audio. The group is the trust circle: whoever may drive
# the interface is in `audio`, and nobody else can create, open or hold a
# lock here. 0.6.8 used 1777, and any local user could pre-create a lock
# file or hold one for ever (ADR 0024). The setgid bit gives new lock
# files the group `audio`; the sticky bit stops one member removing
# another's. Lock files are 0660, and are opened without following
# links and only when they are regular files.
#
# /run is a tmpfs: the directory is recreated on every boot and holds no
# state worth keeping. A lock file left by a crashed process is an empty
# file the kernel already unlocked.
#
# The second line is for lock files that already exist when this runs --
# one left by a 0.6.8 install, created 0666 under the user's own group.
# The unit cannot regroup it itself: a user service with a sandbox runs
# in a user namespace where only the user's own group is mapped, so its
# fchown to `audio` fails with EINVAL (measured). A file the unit creates
# gets `audio` from the setgid bit instead, and on a fresh boot there is
# nothing for this line to do.
d /run/oscmix-desk 3770 root audio -
z /run/oscmix-desk/*.lock 0660 - audio -
